# Reconoce el lenguaje a^n b^n, con n >= 1.
# Marca la primera a disponible con X, busca una b sin marcar y la marca con Y; regresa al inicio y repite. Al terminar las a, comprueba que solo queden Y antes del blanco.
mt:
  states: [q0, q1, q2, q3, q_accept]
  input_alphabet: [a, b]
  tape_alphabet: [a, b, X, Y, B]
  blank: B
  initial_state: q0
  accept_states: [q_accept]
  transitions:
    - state: q0
      read: [X]
      write: [X]
      move: R
      next: q0
    - state: q0
      read: [a]
      write: [X]
      move: R
      next: q1
    - state: q0
      read: [Y]
      write: [Y]
      move: R
      next: q3
    - state: q1
      read: [a]
      write: [a]
      move: R
      next: q1
    - state: q1
      read: [Y]
      write: [Y]
      move: R
      next: q1
    - state: q1
      read: [b]
      write: [Y]
      move: L
      next: q2
    - state: q2
      read: [a]
      write: [a]
      move: L
      next: q2
    - state: q2
      read: [b]
      write: [b]
      move: L
      next: q2
    - state: q2
      read: [X]
      write: [X]
      move: L
      next: q2
    - state: q2
      read: [Y]
      write: [Y]
      move: L
      next: q2
    - state: q2
      read: [B]
      write: [B]
      move: R
      next: q0
    - state: q3
      read: [Y]
      write: [Y]
      move: R
      next: q3
    - state: q3
      read: [B]
      write: [B]
      move: S
      next: q_accept
  inputs:
    - "aab"
    - "aabb"
    - "aaabbb"
    - "ab"
    - "aabbb"
    - "ba"
    - ""