services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: 8000
    ports:
      - "8080:8000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
